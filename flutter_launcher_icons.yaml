flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app-icon/subnetter-logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  image_path_android: "assets/app-icon/subnetter-logo.png"
  adaptive_icon_foreground: "assets/app-icon/android/forground.png"
  adaptive_icon_background: "assets/app-icon/android/background.png"

  windows:
    generate: true
    image_path: "assets/app-icon/subnetter-logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/app-icon/subnetter-logo.png"

  linux:
    generate: true
    image_path: "assets/app-icon/subnetter-logo.png"
    background_color: "#F7F4EF"
    theme_color: "#1C3534"
